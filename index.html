<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>feliz aniversário ❤️</title>

  <style>
    * { -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    .typing {
      font-size: 1.35em;
      line-height: 1.6em;
      white-space: pre-line;
      border-right: 2px solid #fff;
      padding-right: 6px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { border-color: #fff; }
      51%, 100% { border-color: transparent; }
    }

    .heart {
      display: none;
      margin-top: 35px;
      font-size: 5.5em;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .btn {
      display: none;
      margin-top: 35px;
      padding: 12px 28px;
      border-radius: 30px;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      font-size: 1em;
    }

    #start {
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#fff;
      cursor:pointer;
      font-size:1.2em;
      z-index:10;
      text-align:center;
      padding: 20px;
    }

    audio {
      position: fixed;
      bottom: 10px;
      left: 10px;
      width: 1px;
      height: 1px;
      opacity: 0.01;
    }
  </style>
</head>

<body>
  <div id="start">
    toque na tela para começar 🎵
  </div>

  <div class="container">
    <div id="text" class="typing"></div>
    <div id="heart" class="heart">❤️</div>
    <button id="btn" class="btn">toca aqui 💗</button>
  </div>

  <!-- música inicial -->
  <audio id="intro" preload="auto" loop>
    <source src="intro.mp3" type="audio/mpeg">
  </audio>

  <!-- música principal do botão -->
  <audio id="love" preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <script>
    const textEl = document.getElementById("text");
    const heartEl = document.getElementById("heart");
    const btnEl = document.getElementById("btn");
    const startEl = document.getElementById("start");

    const intro = document.getElementById("intro");
    const love = document.getElementById("love");

    const message =
      "pov: hoje é o seu aniversário… ❤️\n\n" +
      "eu pensei em mil jeitos de te surpreender,\n" +
      "mas nenhum é maior do que o amor que eu sinto por você.\n\n" +
      "então eu fiz isso,\n" +
      "só pra te lembrar que você é única.";

    let i = 0;

    function typeWriter() {
      if (i < message.length) {
        textEl.innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 55);
      } else {
        heartEl.style.display = "block";
        btnEl.style.display = "inline-block";
      }
    }

    // clique inicial toca intro
    startEl.addEventListener("click", () => {
      intro.volume = 0.3;
      intro.play().catch(err => console.log("erro intro:", err));
      startEl.style.display = "none";
      typeWriter();
    });

    // botão toca musica.mp3
    btnEl.addEventListener("click", () => {
      intro.pause();
      intro.currentTime = 0;

      love.volume = 1;
      love.currentTime = 0;
      love.play().catch(err => console.log("erro love:", err));

      textEl.innerHTML =
        "feliz aniversário, meu amor 💗\n\n" +
        "que a sua vida seja leve,\n" +
        "que seus sonhos se realizem,\n" +
        "e que eu possa estar ao seu lado\n" +
        "em todos os seus sorrisos e dias difíceis.\n\n" +
        "eu te amo.";

      btnEl.style.display = "none";
    });
  </script>
</body>
</html>
