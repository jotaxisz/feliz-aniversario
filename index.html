<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>feliz aniversário ❤️</title>

<style>
* { -webkit-tap-highlight-color: transparent; margin:0; padding:0; box-sizing:border-box;}
body {
  height: 100vh;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Courier New', monospace;
  color: #fff;
  overflow: hidden;
  position: relative;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  height: 100vh;
}

.text-wrapper {
  flex: 1;
  overflow-y: auto;
  padding-right: 10px;
}

.typing {
  font-size: 1.35em;
  line-height: 1.6em;
  white-space: pre-line;
  border-right: 2px solid #fff;
  padding-right: 6px;
}

@keyframes blink {
  0%, 50% { border-color: #fff; }
  51%, 100% { border-color: transparent; }
}
.typing { animation: blink 1s infinite; }

.heart {
  display: none;
  margin-top: 15px;
  font-size: 5.5em;
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.btn {
  display: none;
  margin-top: 15px;
  padding: 12px 28px;
  border-radius: 30px;
  border: 1px solid #fff;
  background: transparent;
  color: #fff;
  font-size: 1em;
  z-index: 2;
  cursor: pointer;
}

#start {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  cursor:pointer;
  font-size:1.2em;
  z-index:10;
  text-align:center;
  padding: 20px;
}

audio { position: fixed; bottom: 10px; left: 10px; width:1px; height:1px; opacity:0.01; }

.flower-bouquet {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 200px;
  opacity: 0;
  animation: growBouquet 3s forwards;
}

@keyframes growBouquet {
  0% { transform: translateX(-50%) translateY(100px) scale(0); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
}
</style>
</head>

<body>
<div id="start">toque na tela para começar 🎵</div>

<div class="container">
  <div class="text-wrapper">
    <div id="text" class="typing"></div>
  </div>
  <div id="heart" class="heart">❤️</div>
  <button id="btn" class="btn">toca aqui 💗</button>
</div>

<audio id="intro" preload="auto" loop>
  <source src="intro.mp3" type="audio/mpeg">
</audio>
<audio id="love" preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const textEl = document.getElementById("text");
const heartEl = document.getElementById("heart");
const btnEl = document.getElementById("btn");
const startEl = document.getElementById("start");

const intro = document.getElementById("intro");
const love = document.getElementById("love");

// --- TEXTOS ---
const introText = 
"hoje é o seu aniversário… ❤️\n\n" +
"eu pensei em mil jeitos de te surpreender,\n" +
"mas nenhum é maior do que o amor que eu sinto por você.\n\n" +
"então eu fiz isso,\n" +
"só pra te lembrar que você é a única mulher que mais amei na vida.\n\n" +
"seu presente ainda não chegou, mas fiz isso aqui para não passar em branco.\n" +
"eu te amo mais do que tudo, hoje e sempre.";

const longText = `
eu te amo muito e quero passar todos os dias da minha vida com você,
construindo nossa história, nossos sonhos e nossa família.
você é meu amor, minha inspiração e a mulher da minha vida.
você é uma garota muito especial para mim, você me alegra em dias cinzas.
eu realmente te amo muito de verdade, desculpa não ser uma pessoa boa para ti.
quero que você saiba que eu te esperaria 10 anos só para te dar um beijo e abraço.
Cada momento ao seu lado é um pequeno universo que vale a pena existir.
que a vida continue nos presenteando com instantes assim, cheios de riso, cumplicidade e amor.
sua inteligência, seu jeito de ver a vida e de encarar cada desafio me inspiram todos os dias.
Eu admiro cada detalhe seu, cada gesto, cada pensamento.
eu quero que seja você a mãe dos meus filhos, eu anseio por ti, eu quero te abraçar e não largar mais.
desculpe não estar presente nesse momento tão importante da sua vida, uma nova fase.
que você aproveite seu dia, prometo que logo logo estarei ai para te abraçar muito.
Obrigado por tudo mesmo, você me anima muito, você não tem ideia do quão eu amo você.
Beijos meu amor, eu te amo demais, curte muito por mim.
`;

// --- TYPEWRITER ---
function typeWriter(text, callback){
  let i = 0;
  function type(){
    if(i < text.length){
      textEl.innerHTML += text.charAt(i);
      i++;
      let delay = 55;
      if(text.charAt(i-1)==="❤️" || text.charAt(i-1)==="\n") delay=120;
      setTimeout(type, delay);
      textEl.parentElement.scrollTop = textEl.scrollHeight;
      if(i % 80 === 0) createBouquet();
    } else if(callback){
      callback();
    }
  }
  type();
}

// --- INICIO ---
startEl.addEventListener("click", ()=>{
  intro.volume=0.3;
  intro.play().catch(err=>console.log("erro intro:",err));
  startEl.style.display="none";

  typeWriter(introText, ()=>{
    heartEl.style.display="block";
    btnEl.style.display="inline-block";
    createBouquet();
  });
});

// --- BOTAO ---
btnEl.addEventListener("click", ()=>{
  btnEl.style.display="none";

  // crossfade
  const fadeDuration = 2000;
  const steps = 20;
  let step=0;
  love.volume=0;
  love.currentTime=0;
  love.play().catch(err=>console.log("erro love:",err));
  const fadeInterval=setInterval(()=>{
    step++;
    intro.volume = Math.max(0,0.3*(1-step/steps));
    love.volume = Math.min(1, step/steps);
    if(step>=steps){ clearInterval(fadeInterval); intro.pause(); intro.currentTime=0; }
  }, fadeDuration/steps);

  // limpa texto anterior e inicia typewriter do texto longo
  textEl.innerHTML = "";
  typeWriter(longText, ()=>createBouquet(3));
});

// --- BOUQUET ---
function createBouquet(count=1){
  for(let j=0;j<count;j++){
    const svgNS="http://www.w3.org/2000/svg";
    const svg=document.createElementNS(svgNS,"svg");
    svg.setAttribute("class","flower-bouquet");
    svg.setAttribute("width","120");
    svg.setAttribute("height","200");
    svg.innerHTML=`<circle cx="60" cy="180" r="0" fill="transparent">
    <animate attributeName="r" from="0" to="10" dur="3s" fill="freeze"/>
    </circle>
    <circle cx="50" cy="160" r="0" fill="red">
    <animate attributeName="r" from="0" to="10" dur="3s" fill="freeze"/>
    </circle>
    <circle cx="70" cy="160" r="0" fill="pink">
    <animate attributeName="r" from="0" to="10" dur="3s" fill="freeze"/>
    </circle>`;
    document.body.appendChild(svg);
    setTimeout(()=>svg.remove(),4000);
  }
}
</script>
</body>
</html>
