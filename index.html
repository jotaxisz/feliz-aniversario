<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surpresa ❤️</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: #000;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  position: relative;
  width: 100%;
  max-width: 420px;
  height: 100%;
}

.photo {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #fff;
  transition: transform 0.5s;
  z-index: 2;
}

.photo:hover {
  transform: scale(1.1) rotate(-5deg);
}

.balloon {
  position: absolute;
  background: #fff;
  color: #000;
  padding: 10px 14px;
  border-radius: 20px;
  font-size: 0.9em;
  opacity: 0;
  transform: scale(0);
  transition: all 0.5s;
  pointer-events: none;
  max-width: 160px;
  z-index: 3;
  white-space: pre-line;
}

.balloon.show {
  opacity: 1;
  transform: scale(1);
}

#photo1 { top: 50px; left: 30px; }
#balloon1 { top: 10px; left: 30px; }

#photo2 { top: 200px; left: 150px; }
#balloon2 { top: 160px; left: 150px; }

#photo3 { top: 350px; left: 70px; }
#balloon3 { top: 310px; left: 70px; }

#start {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  cursor:pointer;
  font-size:1.5em;
  z-index:10;
  text-align:center;
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: red;
  opacity: 0.8;
  z-index: 1;
  border-radius: 50%;
  animation: fall 3s linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-20px) rotate(0deg); }
  100% { transform: translateY(500px) rotate(360deg); }
}

.rocket {
  position: absolute;
  width: 30px;
  height: 60px;
  background: #ff0;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  bottom: -60px;
  left: 50%;
  transform: translateX(-50%);
  animation: shoot 2s ease-out forwards;
  z-index: 2;
}

@keyframes shoot {
  0% { bottom: -60px; opacity: 1; }
  100% { bottom: 400px; opacity: 0; }
}
</style>
</head>
<body>

<div id="start">Toque na tela para começar 🎵</div>

<div class="container">
  <img id="photo1" class="photo" src="madu.jpg" alt="Foto 1">
  <div id="balloon1" class="balloon"></div>

  <img id="photo2" class="photo" src="maduu.jpg" alt="Foto 2">
  <div id="balloon2" class="balloon"></div>

  <img id="photo3" class="photo" src="maduuu.jpg" alt="Foto 3">
  <div id="balloon3" class="balloon"></div>
</div>

<audio id="music" preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const start = document.getElementById("start");
const music = document.getElementById("music");

const balloons = [
  {el: document.getElementById("balloon1"), text: "Feliz aniversário! 💗\nVocê é incrível!"},
  {el: document.getElementById("balloon2"), text: "Você ilumina meus dias ✨\nTe amo muito!"},
  {el: document.getElementById("balloon3"), text: "Espero que seus sonhos se realizem 💖\nSempre juntos!"}
];

// Confete e foguete
function createConfetti() {
  for(let i=0;i<30;i++){
    const confetti = document.createElement('div');
    confetti.className='confetti';
    confetti.style.left = Math.random()*100 + '%';
    confetti.style.background = `hsl(${Math.random()*360}, 70%, 60%)`;
    confetti.style.animationDuration = 2 + Math.random()*2 + 's';
    document.body.appendChild(confetti);
    setTimeout(()=>confetti.remove(), 4000);
  }
}

function launchRocket(){
  const rocket = document.createElement('div');
  rocket.className='rocket';
  rocket.style.left = 50 + Math.random()*80 - 40 + '%';
  document.body.appendChild(rocket);
  setTimeout(()=>rocket.remove(), 2000);
}

// Typewriter para balões
function typeText(balloon, text, callback){
  let i=0;
  balloon.classList.add("show");
  balloon.innerHTML = "";
  function type(){
    if(i<text.length){
      balloon.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 40);
    } else if(callback) {
      callback();
    }
  }
  type();
}

// Clique inicial
start.addEventListener("click", () => {
  start.style.display = "none";
  music.volume = 0.5;
  music.play().catch(err=>console.log(err));

  // mostrar balões em sequência com typewriter
  typeText(balloons[0].el, balloons[0].text, ()=> {
    setTimeout(()=>typeText(balloons[1].el, balloons[1].text, ()=> {
      setTimeout(()=>typeText(balloons[2].el, balloons[2].text), 500);
    }), 500);
  });

  // Confetes e foguetes
  setInterval(createConfetti, 1000);
  setInterval(launchRocket, 1500);
});
</script>

</body>
</html>
