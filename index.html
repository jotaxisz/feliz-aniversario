<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Feliz Aniversário ❤️</title>

<style>
* { -webkit-tap-highlight-color: transparent; margin:0; padding:0; box-sizing:border-box; }

body {
  height: 100vh;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Courier New', monospace;
  color: #fff;
  overflow: hidden;
  position: relative;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  height: 100vh;
}

.text-wrapper {
  flex: 1;
  overflow-y: auto;
  padding-right: 10px;
}

.typing {
  font-size: 1.3em;
  line-height: 1.6em;
  white-space: pre-line;
  border-right: 2px solid #fff;
  padding-right: 6px;
}

@keyframes blink {
  0%, 50% { border-color: #fff; }
  51%, 100% { border-color: transparent; }
}
.typing { animation: blink 1s infinite; }

.heart {
  display: none;
  margin-top: 15px;
  font-size: 5.5em;
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.btn {
  display: none;
  margin-top: 15px;
  padding: 12px 28px;
  border-radius: 30px;
  border: 1px solid #fff;
  background: transparent;
  color: #fff;
  font-size: 1em;
  z-index: 2;
  cursor: pointer;
}

#start {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  cursor:pointer;
  font-size:1.2em;
  z-index:10;
  text-align:center;
  padding: 20px;
}

audio { position: fixed; bottom: 10px; left: 10px; width:1px; height:1px; opacity:0.01; }

/* Flores animadas no fundo */
.flower {
  position: absolute;
  bottom: -50px;
  width: 15px;
  height: 15px;
  background: pink;
  border-radius: 50%;
  opacity: 0.8;
  animation: floatUp linear forwards;
}
@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 0.8; }
  100% { transform: translateY(-120vh) scale(0.5); opacity: 0; }
}
</style>
</head>

<body>
<div id="start">toque na tela para começar 🎵</div>

<div class="container">
  <div class="text-wrapper">
    <div id="text" class="typing"></div>
  </div>
  <div id="heart" class="heart">❤️</div>
  <button id="btn" class="btn">toca aqui 💗</button>
</div>

<audio id="intro" preload="auto" loop>
  <source src="intro.mp3" type="audio/mpeg">
</audio>
<audio id="love" preload="auto" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const textEl = document.getElementById("text");
const heartEl = document.getElementById("heart");
const btnEl = document.getElementById("btn");
const startEl = document.getElementById("start");

const intro = document.getElementById("intro");
const love = document.getElementById("love");

// Texto completo com tudo que você queria
const message = 
"feliz aniversário, meu amor 💗\n\n" +
"que a sua vida seja leve,\n" +
"que seus sonhos se realizem,\n" +
"e que eu possa estar ao seu lado em todos os seus sorrisos e dias difíceis.\n\n" +
"eu te amo muito e quero passar todos os dias da minha vida com você,\n" +
"construindo nossa história, nossos sonhos e nossa família.\n" +
"você é meu amor, minha inspiração e a mulher da minha vida.\n" +
"você é uma garota muito especial para mim, você me alegra em dias cinzas.\n" +
"eu realmente te amo muito de verdade, desculpa não ser uma pessoa boa para ti.\n" +
"quero que você saiba que eu te esperaria 10 anos só para te dar um beijo e abraço.\n" +
"cada momento ao seu lado é um pequeno universo que vale a pena existir.\n" +
"que a vida continue nos presenteando com instantes assim, cheios de riso, cumplicidade e amor.\n" +
"sua inteligência, seu jeito de ver a vida e de encarar cada desafio me inspiram todos os dias.\n" +
"eu admiro cada detalhe seu, cada gesto, cada pensamento.\n" +
"eu quero que seja você a mãe dos meus filhos, eu anseio por ti, eu quero te abraçar e não largar mais.\n" +
"desculpe não estar presente nesse momento tão importante da sua vida, uma nova fase.\n" +
"que você aproveite seu dia, prometo que logo logo estarei aí para te abraçar muito.\n" +
"obrigado por tudo mesmo, você me anima muito, você não tem ideia o quão eu amo você.\n"+ 
"beijos meu amor, eu te amo dms, curte muito por mim. \n";

let i = 0;

// Cria flores animadas no fundo
function createFlower() {
  const flower = document.createElement('div');
  flower.className = 'flower';
  flower.style.left = Math.random() * 100 + 'vw';
  flower.style.background = ['pink', 'red', 'magenta', 'purple'][Math.floor(Math.random()*4)];
  flower.style.width = flower.style.height = 10 + Math.random()*15 + 'px';
  flower.style.animationDuration = 6 + Math.random()*4 + 's';
  document.body.appendChild(flower);
  setTimeout(()=>flower.remove(), 10000);
}

// Typewriter com flores
function typeWriter() {
  if (i < message.length) {
    textEl.innerHTML += message.charAt(i);
    i++;
    let delay = 50;
    if(message.charAt(i-1)==="❤️" || message.charAt(i-1)==="💗" || message.charAt(i-1)==="\n") delay = 120;

    if(Math.random()<0.05) createFlower(); // pequenas chances de flores surgindo
    textEl.parentElement.scrollTop = textEl.scrollHeight;
    setTimeout(typeWriter, delay);
  } else {
    heartEl.style.display="block";
    btnEl.style.display="inline-block";
  }
}

startEl.addEventListener("click", ()=>{
  intro.volume = 0.3;
  intro.play().catch(err=>console.log("erro intro:",err));
  startEl.style.display = "none";
  typeWriter();
});

btnEl.addEventListener("click", ()=>{
  const fadeDuration = 2000;
  const steps = 20;
  let step = 0;
  love.volume = 0;
  love.currentTime = 0;
  love.play().catch(err=>console.log("erro love:",err));

  const fadeInterval = setInterval(()=>{
    step++;
    intro.volume = Math.max(0, 0.3*(1-step/steps));
    love.volume = Math.min(1, step/steps);
    if(step>=steps){ clearInterval(fadeInterval); intro.pause(); intro.currentTime=0; }
  }, fadeDuration/steps);
  btnEl.style.display="none";
});
</script>
</body>
</html>
