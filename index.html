<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>feliz aniversário ❤️</title>

  <style>
    * { -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    .typing {
      font-size: 1.35em;
      line-height: 1.6em;
      white-space: pre-line;
      border-right: 2px solid #fff;
      padding-right: 6px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { border-color: #fff; }
      51%, 100% { border-color: transparent; }
    }

    .heart {
      display: none;
      margin-top: 35px;
      font-size: 5.5em;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .btn {
      display: none;
      margin-top: 35px;
      padding: 12px 28px;
      border-radius: 30px;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      font-size: 1em;
    }

    .hint {
      position: absolute;
      bottom: 25px;
      font-size: 0.8em;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="text" class="typing"></div>
    <div id="heart" class="heart">❤️</div>
    <button id="btn" class="btn">toca aqui 💗</button>
  </div>

  <div class="hint">feito especialmente pra você 💗</div>

  <!-- 🎵 áudio -->
  <audio id="music" preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <script>
    const textEl = document.getElementById("text");
    const heartEl = document.getElementById("heart");
    const btnEl = document.getElementById("btn");
    const music = document.getElementById("music");

    const message =
      "pov: hoje é o seu aniversário… ❤️\n\n" +
      "e eu pensei em mil jeitos de te surpreender,\n" +
      "mas nenhum é maior do que o amor que eu sinto por você.\n\n" +
      "então eu fiz isso,\n" +
      "só pra te lembrar que você é única.";

    let i = 0;

    function typeWriter() {
      if (i < message.length) {
        textEl.innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 55);
      } else {
        heartEl.style.display = "block";
        btnEl.style.display = "inline-block";
      }
    }

    // 👇 CLIQUE REAL = ÁUDIO LIBERADO (ANDROID SAFE)
    btnEl.addEventListener("click", () => {
      music.currentTime = 0;
      music.volume = 1;

      music.play().catch(() => {
        console.log("navegador bloqueou o áudio");
      });

      textEl.innerHTML =
        "feliz aniversário, meu amor 💗\n\n" +
        "que a sua vida seja leve,\n" +
        "que seus sonhos se realizem,\n" +
        "e que eu possa estar ao seu lado\n" +
        "em todos os seus sorrisos e dias difíceis.\n\n" +
        "eu te amo.";

      btnEl.style.display = "none";
    });

    typeWriter();
  </script>
</body>
</html>
